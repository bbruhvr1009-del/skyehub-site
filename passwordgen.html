<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Secure password generator</title>
<style type="text/css">
 body {
  width: 640px;
  text-align: center;
  margin: 0.2em auto;
  padding: 0;
  background-color: #e6e6ec;
  background-image: none;
  color: #000000;
  font: 110% serif;
 }
 div {
  text-align: left;
 }
 h1 {
  border-style: double none;
  margin: 0.5em auto 1em;
  text-align: center;
  font-size: 140%;
  font-weight: bold;
  white-space: nowrap;
 }
 fieldset {
  margin: 1em auto;
  padding: 0 0.2em 1em 0.15em;
  text-align: left;
 }
 legend {
  font-style: italic;
 }
 fieldset div {
  margin: 0.5em auto;
  text-align: center;
  white-space: nowrap;
 }
 label {
  white-space: nowrap;
  margin: auto;
 }
 tt {
  font-family: monospace;
  white-space: nowrap;
 }
 input {
  background-color: #ffffff;
  color: #000000;
  text-align: center;
  vertical-align: middle;
  font: 120% monospace;
 }
 input[type=checkbox] {
  margin: -0.1em -0.2em 0.1em -0.1em;
 }
 input[type=submit], input[type=button], input[type=reset] {
  margin: 0.1em auto;
  width: 12em;
  height: 4em;
  border: 0.2em outset #000000;
  font-weight: bold;
  background-color: #e6e6ec;
  cursor: pointer;
 }
 #result {
  margin: 1em auto;
  text-align: center;
 }
 #result tt {
  display: inline-block;
  background: #ffffff;
  border: 1px solid #999;
  padding: 0.4em 0.6em;
  font-size: 130%;
  word-break: break-all;
 }
 #copy-msg {
  text-align: center;
  font-size: 90%;
  color: #2a7a2a;
  min-height: 1.2em;
 }
 div.menu {
  margin: 1.5em auto 0.5em;
  border-style: double none;
  text-align: center;
  font-size: 120%;
  white-space: nowrap;
 }
</style>
</head>

<body>

<h1>Secure password generator</h1>

<form id="genform" onsubmit="return false;">
 <fieldset>
  <legend>Choice of characters</legend>
  <label>
   <input type="checkbox" name="lower" id="lower" value="1" checked>
   Lower-case letters: <tt>abcdefghijklmnopqrstuvwxyz</tt>
  </label><br>
  <label>
   <input type="checkbox" name="upper" id="upper" value="1" checked>
   Upper-case letters: <tt>ABCDEFGHIJKLMNOPQRSTUVWXYZ</tt>
  </label><br>
  <label>
   <input type="checkbox" name="digit" id="digit" value="1" checked>
   Digits: <tt>0123456789</tt>
  </label><br>
  <label>
   <input type="checkbox" name="punct" id="punct" value="1">
   Punctuation and special characters: <tt>!&quot;#$%&amp;'()*+,-./:;&lt;=&gt;?&#64;[\]^_`{|}~</tt>
  </label>
 </fieldset>
 <fieldset>
  <legend>Other settings</legend>
  <label>
   <input type="checkbox" name="rqlow" id="rqlow" value="1">
   Require the password to begin and end with a lower-case letter
  </label><br>
  <label>
   Length of the password:
   <input type="text" size="2" maxlength="2" name="lngth" id="lngth" value="16" style="width: 2em;">
   characters
  </label>
 </fieldset>
 <fieldset>
  <legend>Let it go</legend>
  <div>
   <input type="button" id="generate" value="Generate password" onclick="generatePassword()">
   <input type="reset" value="Restore settings">
  </div>
 </fieldset>
</form>

<div id="result">
 <tt id="password-output">&nbsp;</tt>
 <div>
  <input type="button" value="Copy" onclick="copyPassword()">
 </div>
 <div id="copy-msg">&nbsp;</div>
</div>

<div class="menu">
 <hr>
 &#8226;
 <a href="https://www.skyehub.org/">Main page</a>
 &#8226;
</div>

<script>
function generatePassword() {
  const useLower = document.getElementById('lower').checked;
  const useUpper = document.getElementById('upper').checked;
  const useDigit = document.getElementById('digit').checked;
  const usePunct = document.getElementById('punct').checked;
  const requireLower = document.getElementById('rqlow').checked;
  let length = parseInt(document.getElementById('lngth').value, 10);

  if (isNaN(length) || length < 1) length = 16;
  if (length > 99) length = 99;

  const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
  const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const digitChars = '0123456789';
  const punctChars = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';

  let pool = '';
  if (useLower) pool += lowerChars;
  if (useUpper) pool += upperChars;
  if (useDigit) pool += digitChars;
  if (usePunct) pool += punctChars;

  if (!pool) {
    document.getElementById('password-output').textContent = '(select at least one character set)';
    document.getElementById('copy-msg').textContent = '';
    return;
  }

  if (requireLower && !useLower) {
    document.getElementById('password-output').textContent = '("require lower-case" needs lower-case enabled)';
    document.getElementById('copy-msg').textContent = '';
    return;
  }

  if (requireLower && length < 2) {
    length = 2;
  }

  function randomChar(charset) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return charset[arr[0] % charset.length];
  }

  let chars = [];
  for (let i = 0; i < length; i++) {
    chars.push(randomChar(pool));
  }
  if (requireLower) {
    chars[0] = randomChar(lowerChars);
    chars[chars.length - 1] = randomChar(lowerChars);
  }
  const password = chars.join('');

  document.getElementById('password-output').textContent = password;
  document.getElementById('copy-msg').textContent = '';
}

function copyPassword() {
  const text = document.getElementById('password-output').textContent;
  const msg = document.getElementById('copy-msg');
  if (!text || text.trim() === '' || text.startsWith('(')) {
    msg.textContent = 'Generate a password first.';
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    msg.textContent = 'Copied to clipboard!';
    setTimeout(() => { msg.textContent = ''; }, 2000);
  }).catch(() => {
    msg.textContent = 'Copy failed — select and copy manually.';
  });
}

// Generate one on page load
generatePassword();
</script>

</body>

</html>
