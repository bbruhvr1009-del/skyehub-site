<h1>Secure password generator</h1>

<form method="POST" action="/cgi-bin/generator.cgi">
 <fieldset>
  <legend>Choice of characters</legend>
  <p><a rel="help" href="/help.html#chars">Help</a></p>
  <label>
   <input type="checkbox" name="lower" id="lower" value="1" checked>
   Lower-case letters: <tt>abcdefghijklmnopqrstuvwxyz</tt>
  </label><br>
  <label>
   <input type="checkbox" name="upper" id="upper" value="1" checked>
   Upper-case letters: <tt>ABCDEFGHIJKLMNOPQRSTUVWXYZ</tt>
  </label><br>
  <label>
   <input type="checkbox" name="digit" id="digit" value="1" checked>
   Digits: <tt>0123456789</tt>
  </label><br>
  <label>
   <input type="checkbox" name="punct" id="punct" value="1">
   Punctuation and special characters: <tt>!&quot;#$%&amp;'()*+,-./:;&lt;=&gt;?&#64;[\]^_`{|}~</tt>
  </label>
 </fieldset>
 <fieldset>
  <legend>Other settings</legend>
  <p><a rel="help" href="/help.html#other">Help</a></p>
  <label>
   <input type="checkbox" name="rqlow" id="rqlow" value="1">
   Require the password to begin and end with a lower-case letter
  </label><br>
  <label>
   Length of the password:
   <input type="text" size="2" maxlength="2" name="lngth" id="lngth" value="16" style="width: 2em;">
   characters
  </label>
 </fieldset>
 <fieldset>
  <legend>Let it go</legend>
  <p><a rel="help" href="/help.html#go">Help</a></p>
  <label class="cookies">
   <input type="checkbox" name="csave" id="csave" value="1">
   Save changed settings
  </label>
  <label class="cookies">
   for
   <input type="text" size="3" maxlength="4" name="cdays" id="cdays" value="365" style="width: 2.5em;">
   days (0 means till browser close)
  </label>
  <div>
   <input type="submit" name="generate" id="generate" value="Generate password">
   <input type="submit" name="settings" id="settings" value="Change settings">
   <input type="reset" value="Restore settings">
  </div>
 </fieldset>
</form>
