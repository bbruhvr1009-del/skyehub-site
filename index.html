<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EverGlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="wordmark">EverGlow</h1>
      <p class="tagline" id="auth-tagline">welcome back</p>

      <form id="auth-form" novalidate>
        <label class="field">
          <span>email</span>
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>password</span>
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
        </label>

        <p id="auth-error" class="error" role="alert" hidden></p>

        <button type="submit" class="btn-primary" id="auth-submit">Log In</button>
      </form>

      <button type="button" class="link-btn" id="auth-toggle">
        new here? <span>create an account</span>
      </button>
    </div>
  </main>

  <div id="app-shell" class="app-shell" hidden>

    <aside class="sidebar">
      <div class="sidebar-brand">EverGlow</div>

      <nav class="sidebar-nav">
        <div class="nav-item active" data-view="home">
          <span class="nav-icon">🏠</span>
          <span>Home</span>
        </div>
        <div class="nav-item" data-view="search">
          <span class="nav-icon">🔍</span>
          <span>Search</span>
        </div>
        <div class="nav-item" data-view="profile">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </div>
        <div class="nav-item" data-view="settings">
          <span class="nav-icon">⚙️</span>
          <span>Settings</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-avatar" id="mini-avatar">?</div>
        <div class="mini-info">
          <div id="mini-name">—</div>
          <div id="mini-handle" class="muted">—</div>
        </div>
      </div>
    </aside>

    <section class="main-panel">

      <div class="view" id="view-home">
        <h1 class="view-title">Home</h1>
        <div class="placeholder-card">
          Your DMs will show up here. This is just the starting shell — hook your message list up whenever you're ready.
        </div>
      </div>

      <div class="view" id="view-search" hidden>
        <h1 class="view-title">Search</h1>
        <input type="text" class="search-input" placeholder="Find people or servers">
      </div>

      <div class="view" id="view-profile" hidden>
        <div class="banner"></div>
        <div class="profile-body">
          <div class="avatar-ring" id="avatar-ring">
            <span id="avatar-initial">?</span>
          </div>
          <div class="info-card">
            <h2 id="welcome-name">—</h2>
            <p id="welcome-email" class="muted">—</p>
          </div>
        </div>
      </div>

      <div class="view" id="view-settings" hidden>
        <h1 class="view-title">Settings</h1>
        <button type="button" class="btn-danger" id="sign-out">Sign Out</button>
      </div>

    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
