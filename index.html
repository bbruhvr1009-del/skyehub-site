<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EverGlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="wordmark">EverGlow</h1>
      <p class="tagline" id="auth-tagline">welcome back</p>

      <form id="auth-form" novalidate>
        <label class="field">
          <span>email</span>
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>password</span>
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
        </label>

        <p id="auth-error" class="error" role="alert" hidden></p>

        <button type="submit" class="btn-primary" id="auth-submit">Log In</button>
      </form>

      <button type="button" class="link-btn" id="auth-toggle">
        new here? <span>create an account</span>
      </button>
    </div>
  </main>

  <main id="app-screen" class="screen" hidden>
    <div class="banner"></div>

    <div class="welcome-card">
      <div class="avatar-ring" id="avatar-ring">
        <span id="avatar-initial">?</span>
      </div>

      <div class="info-card">
        <h2 id="welcome-name">—</h2>
        <p id="welcome-email" class="muted">—</p>
      </div>
    </div>

    <div class="placeholder-card">
      Your DMs will show up here. This is just the starting shell — hook your message list up whenever you're ready.
    </div>

    <nav class="bottom-nav">
      <div class="nav-item">🏠<span>Home</span></div>
      <div class="nav-item">🔍<span>Search</span></div>
      <div class="nav-item active">👤<span>Profile</span></div>
      <div class="nav-item" id="nav-settings">⚙️<span>Settings</span></div>
    </nav>

    <div class="settings-panel" id="settings-panel" hidden>
      <h2 class="panel-title">Settings</h2>
      <button type="button" class="btn-danger" id="sign-out">Sign Out</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
