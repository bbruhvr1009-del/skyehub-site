<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everglow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="glow-field" aria-hidden="true"></div>

  <!-- AUTH SCREEN -->
  <main id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="wordmark">everglow</h1>
      <p class="tagline" id="auth-tagline">welcome back</p>

      <form id="auth-form" novalidate>
        <label class="field">
          <span>email</span>
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>password</span>
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
        </label>

        <p id="auth-error" class="error" role="alert" hidden></p>

        <button type="submit" class="btn-primary" id="auth-submit">log in</button>
      </form>

      <button type="button" class="link-btn" id="auth-toggle">
        new here? <span>create an account</span>
      </button>
    </div>
  </main>

  <!-- APP SCREEN -->
  <main id="app-screen" class="screen" hidden>
    <header class="app-header">
      <h1 class="wordmark small">everglow</h1>
      <button type="button" class="btn-ghost" id="sign-out">sign out</button>
    </header>

    <section class="welcome-card">
      <div class="avatar-ring" id="avatar-ring">
        <span id="avatar-initial">?</span>
      </div>
      <h2 id="welcome-name">—</h2>
      <p id="welcome-email" class="muted">—</p>
    </section>

    <section class="placeholder-card">
      <p>Your DMs will glow up here soon. This is just the starting shell — hook your message list up whenever you're ready.</p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
